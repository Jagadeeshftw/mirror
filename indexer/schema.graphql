# ------------------------------------------------------------------------------------------------
# Copy quality
# ------------------------------------------------------------------------------------------------

"""
Copy-quality aggregates for the public stats page, per scope (global excludes copies whose follower or
leader is team-run), for all leaders or one leader, all time or one UTC day. Deviation and latency
samples come only from keeper copies (not match-now). Percentiles are nearest-rank over exact counts.
"""
type CopyQualityStats {
  "<scope>-<leaderAccountId|all>-<day|all>"
  id: ID!
  scope: String! @index
  "Null = all leaders."
  leaderAccountId: BigInt @index
  leader: PerplAccount
  period: StatsPeriod! @index
  "Null for ALL_TIME."
  day: Int @index
  date: String
  copies: Int!
  matchNowCopies: Int!
  opens: Int!
  closes: Int!
  copiedNotionalCNS: BigInt!
  "Sum of CopyEvent.builderFeeCNS over the copies in this row (keeper copies and match-now)."
  builderFeesCNS: BigInt!
  blocked: Int!
  "Copies with a deviation sample (filled keeper copies with a leader fill price)."
  deviationSamples: Int!
  "Deviation samples measured against the leader's actual onchain fill (the rest use the keeper-reported fill)."
  deviationSamplesActual: Int!
  deviationSumBps: BigInt!
  avgDeviationBps: Int
  medianDeviationBps: Int
  p90DeviationBps: Int
  "Samples where the follower got a worse price than the leader (deviation > 0)."
  worseThanLeader: Int!
  latencySamples: Int!
  medianLatencyBlocks: Int
  p90LatencyBlocks: Int
  medianLatencySeconds: Int
  p90LatencySeconds: Int
  "Copies whose leader fill could be looked up onchain (leaderRef tx indexed)."
  leaderFillVerified: Int!
  "Copies where the keeper-reported leader fill differs from the actual one."
  leaderFillMismatches: Int!
  updatedAt: Int!
}

"Exact value histograms behind CopyQualityStats percentiles (parallel arrays sorted by value)."
type CopyQualityHistogram @internal {
  "same id as the CopyQualityStats row"
  id: ID!
  deviationValues: [Int!]!
  deviationCounts: [Int!]!
  latencyBlockValues: [Int!]!
  latencyBlockCounts: [Int!]!
  latencySecondValues: [Int!]!
  latencySecondCounts: [Int!]!
}

"Blocked copies per reason, per scope, for all leaders or one leader, all time or one UTC day."
type BlockReasonStats {
  "<scope>-<leaderAccountId|all>-<day|all>-<reason>"
  id: ID!
  scope: String! @index
  leaderAccountId: BigInt @index
  leader: PerplAccount
  period: StatsPeriod! @index
  day: Int @index
  date: String
  reason: BlockReason!
  count: Int!
}
