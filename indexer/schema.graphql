# Mirror indexer schema.
#
# Units: every *CNS field is collateral (AUSD, 6 decimals), *PNS is a Perpl price in the market's
# priceDecimals, *LNS is a size in the market's lotDecimals, *Hdths is hundredths (leverage 1000 = 10x),
# *Bps is basis points. Timestamps are unix seconds. `day` is floor(timestamp / 86400) (UTC).

enum Side {
  LONG
  SHORT
}

enum PositionEventKind {
  OPEN
  INCREASE
  DECREASE
  CLOSE
  INVERT
  LIQUIDATION
  DELEVERAGE
}

"How PositionEvent.pricePNS was obtained."
enum PriceSource {
  "Execution price emitted by the event (open, close, invert, liquidation, deleverage)."
  EVENT
  "Decrease exit price derived exactly from deltaPnl and the tracked entry price."
  DERIVED_FROM_PNL
  "Increase fill price derived from the change in Perpl's average entry price."
  DERIVED_FROM_ENTRY
  "Entry price unknown (position opened before the indexed range): last trade price of the market."
  LAST_TRADE
  "No price available."
  NONE
}

enum StatsWindow {
  D7
  D30
  D90
}

enum MirrorOrderType {
  OPEN_LONG
  OPEN_SHORT
  CLOSE_LONG
  CLOSE_SHORT
}

"MirrorAccount.BlockReason, same order as the Solidity enum."
enum BlockReason {
  None
  Paused
  Expired
  LeaderNotAllowed
  LeaderSideMismatch
  MarketNotAllowed
  LeverageTooHigh
  SlippageTooHigh
  FlipNotAllowed
  StaleMark
  ExceedsLeaderTarget
  ExceedsMaxNotional
  DailyLossStop
  DrawdownStop
  LeverageTooLow
  EntryTooFar
  MarketHeldByOtherLeader
  LeaderBudgetExceeded
  LeaderLossStop
  MarketHalted
  CloseBelowTarget
  BuilderFeeTooHigh
  LeaderDetached
  Unknown
}

"MirrorAccount.StopKind, same order as the Solidity enum."
enum StopKind {
  DailyLoss
  Drawdown
  LeaderLoss
  StopLoss
  TakeProfit
  Unknown
}

"Where CopyEvent.followerFillPNS came from."
enum FollowerFillSource {
  "CopyProof.fillPNS emitted by the MirrorAccount (opening copies)."
  PROOF
  "The follower's own Perpl position event in the same transaction (closing copies, or opens without a proof fill)."
  PERPL_EVENT
  "Nothing filled, or no priced Perpl event."
  NONE
}

"Which leader fill price CopyEvent.deviationBps is measured against."
enum LeaderFillBasis {
  "The leader's own Perpl position event(s) in the leaderRef transaction."
  ACTUAL
  "The keeper-reported CopyProof.leaderFillPNS (the leaderRef transaction was not indexed or carried no priced leader event)."
  REPORTED
  "No leader fill price (match-now copies, or nothing reported and nothing indexed)."
  NONE
}

enum StatsPeriod {
  ALL_TIME
  DAY
}

enum ActivityKind {
  CREATED
  PERPL_ACCOUNT_CREATED
  DEPOSITED
  WITHDRAWN
  POLICY_UPDATED
  PAUSED
  UNPAUSED
  MIRRORED
  BLOCKED
  CLOSED_ALL
  FOLLOWED
  STOP_TRIGGERED
  LEVEL_SET
  LEADER_STOPPED
  MARKET_CLOSED
  "LeaderDetachedSet(leader, true): stop following the leader, keep its positions."
  LEADER_DETACHED
  "LeaderDetachedSet(leader, false): copying the leader again (owner, follow() or the leader's removal)."
  LEADER_REATTACHED
}

# ------------------------------------------------------------------------------------------------
# Perpl
# ------------------------------------------------------------------------------------------------

"A Perpl perpetual market."
type Market {
  "perpId"
  id: ID!
  perpId: Int!
  symbol: String!
  lotDecimals: Int!
  priceDecimals: Int!
  "False when the market is not in the static table and no ContractAdded event was seen; notional is then 0."
  decimalsKnown: Boolean!
  "Last execution price seen in a position event."
  lastPricePNS: BigInt!
  lastTradeAt: Int!
  volumeCNS: BigInt!
  trades: Int!
  "Open interest tracked from position events (exact only when synced from the Perpl deploy block)."
  longLotsLNS: BigInt!
  shortLotsLNS: BigInt!
  fundingEvents: Int!
  lastFundingRatePct100k: BigInt!
  lastFundingAt: Int!
  positions: [Position!]! @derivedFrom(field: "market")
}

"A Perpl exchange account. Leaders and followers' MirrorAccounts are both Perpl accounts."
type PerplAccount {
  "Perpl account id (decimal)"
  id: ID!
  accountId: BigInt!
  "Owner address on Perpl (a MirrorAccount clone for followers). Null until AccountCreated or the eth_call lookup."
  address: String @index
  isMirrorAccount: Boolean!
  mirrorAccount: MirrorAccount
  teamRun: Boolean!
  balanceCNS: BigInt!
  totalDepositedCNS: BigInt!
  totalWithdrawnCNS: BigInt!
  netDepositedCNS: BigInt!
  createdAt: Int
  createdBlock: Int
  stats: LeaderStats
  positions: [Position!]! @derivedFrom(field: "account")
  events: [PositionEvent!]! @derivedFrom(field: "account")
  daily: [DailyAccountStats!]! @derivedFrom(field: "account")
  equityCurve: [EquityPoint!]! @derivedFrom(field: "account")
  windows: [LeaderWindowStats!]! @derivedFrom(field: "account")
  "Copy-quality aggregates of the copies of this account as a leader."
  copyQuality: [CopyQualityStats!]! @derivedFrom(field: "leader")
}

"Current position of an account in one market (one row per account+perp, kept after close)."
type Position {
  "<accountId>-<perpId>"
  id: ID!
  account: PerplAccount!
  market: Market!
  perpId: Int!
  side: Side!
  lotsLNS: BigInt!
  "Perpl's average entry price (excludes the Q16 residue)."
  entryPricePNS: BigInt!
  "Fraction of one PNS (1/65536ths) on top of entryPricePNS"
  entryResidueQ16: BigInt!
  depositCNS: BigInt!
  leverageHdths: Int!
  isOpen: Boolean! @index
  "False when the position predates the indexed range and its size was never observed."
  lotsKnown: Boolean!
  openedAt: Int!
  openedBlock: Int!
  updatedAt: Int!
  realizedPnlCNS: BigInt!
  fundingCNS: BigInt!
  feesCNS: BigInt!
  trades: Int!
  lastExecPricePNS: BigInt!
  lastTxHash: String!
  isMirrorAccount: Boolean!
  teamRun: Boolean!
  "MirrorAccounts only: leader whose copy opened the open position (MirrorAccount.marketLeader). Null when flat or not opened by a copy."
  heldForLeaderAccountId: BigInt
  events: [PositionEvent!]! @derivedFrom(field: "position")
}

"Full trade history: one row per Perpl position event."
type PositionEvent {
  "<txHash>-<logIndex>"
  id: ID!
  account: PerplAccount!
  accountId: BigInt! @index
  position: Position!
  market: Market!
  perpId: Int!
  kind: PositionEventKind!
  "Side after the event (the new side for INVERT, the closed side for CLOSE)."
  side: Side!
  lotsBeforeLNS: BigInt!
  lotsAfterLNS: BigInt!
  "Lots traded: opened + closed (INVERT counts both legs)."
  lotsTradedLNS: BigInt!
  lotsClosedLNS: BigInt!
  lotsOpenedLNS: BigInt!
  lotsKnown: Boolean!
  pricePNS: BigInt!
  priceSource: PriceSource!
  entryPricePNS: BigInt!
  notionalCNS: BigInt!
  "Perpl deltaPnl: realized price PnL of the closed lots, excludes funding and fees."
  realizedPnlCNS: BigInt!
  "Funding settled on the event; positive = received."
  fundingCNS: BigInt!
  "insFee + protFee charged on opening legs."
  feeCNS: BigInt!
  netPnlCNS: BigInt!
  leverageHdths: Int!
  depositBeforeCNS: BigInt!
  depositAfterCNS: BigInt!
  isMirrorAccount: Boolean!
  teamRun: Boolean!
  blockNumber: Int! @index
  timestamp: Int! @index
  txHash: String! @index
  logIndex: Int!
}

"All-time performance of a Perpl account (the leaderboard row)."
type LeaderStats {
  "Perpl account id"
  id: ID!
  account: PerplAccount!
  accountId: BigInt!
  address: String
  isMirrorAccount: Boolean! @index
  teamRun: Boolean! @index
  trades: Int!
  openingTrades: Int!
  closingTrades: Int!
  wins: Int!
  losses: Int!
  winRateBps: Int!
  liquidations: Int!
  realizedPnlCNS: BigInt!
  fundingCNS: BigInt!
  feesCNS: BigInt!
  "realized + funding - fees: the realized equity curve."
  netPnlCNS: BigInt! @index
  volumeCNS: BigInt! @index
  openingNotionalCNS: BigInt!
  "sum(leverageHdths * opening notional), for the notional-weighted average."
  leverageNotionalSum: BigInt!
  avgLeverageHdths: Int!
  peakNetPnlCNS: BigInt!
  maxDrawdownCNS: BigInt!
  "Max drawdown relative to (capital base + peak net PnL)."
  maxDrawdownBps: Int!
  "High-water mark of net collateral deposited into Perpl."
  capitalBaseCNS: BigInt!
  "netPnl / capitalBase, in bps (0 when the capital base is unknown)."
  pnlBps: Int!
  marketsTraded: [Int!]!
  marketCount: Int!
  openPositions: Int!
  firstTradeAt: Int!
  lastTradeAt: Int! @index
  lastTradeBlock: Int!
  lastTradeDay: Int!
  "Non-team-run MirrorAccounts whose policy currently lists this leader."
  followers: Int! @index
  copiesExecuted: Int!
  copiesBlocked: Int!
  copiedNotionalCNS: BigInt!
  "Builder fees (CopyEvent.builderFeeCNS) paid by non-team-run followers on copies of this leader."
  builderFeesCNS: BigInt!
  "Realized PnL of followers attributed to this leader (FIFO)."
  followerPnlCNS: BigInt!
  "Times a non-team-run follower's per-leader loss stop fired for this leader (LeaderStopped)."
  followerLeaderStops: Int!
  windows: [LeaderWindowStats!]! @derivedFrom(field: "leaderStats")
}

"Rolling 7d/30d/90d figures, refreshed on every trade and by the hourly rollover at the head."
type LeaderWindowStats {
  "<accountId>-<D7|D30|D90>"
  id: ID!
  account: PerplAccount!
  leaderStats: LeaderStats!
  accountId: BigInt!
  window: StatsWindow! @index
  days: Int!
  "Last UTC day included (windows cover days asOfDay-days+1 .. asOfDay)."
  asOfDay: Int! @index
  isMirrorAccount: Boolean! @index
  teamRun: Boolean! @index
  trades: Int! @index
  closingTrades: Int!
  wins: Int!
  losses: Int!
  winRateBps: Int!
  realizedPnlCNS: BigInt!
  fundingCNS: BigInt!
  feesCNS: BigInt!
  netPnlCNS: BigInt! @index
  volumeCNS: BigInt! @index
  openingNotionalCNS: BigInt!
  leverageNotionalSum: BigInt!
  avgLeverageHdths: Int!
  "Cumulative net PnL at the start of the window (drawdown baseline)."
  startCumPnlCNS: BigInt!
  peakCumPnlCNS: BigInt!
  maxDrawdownCNS: BigInt! @index
  maxDrawdownBps: Int!
  "netPnl / capitalBase in bps."
  pnlBps: Int!
  activeDays: Int!
  lastTradeAt: Int!
}

"Per account per UTC day aggregates; the source for windows and the equity curve."
type DailyAccountStats {
  "<accountId>-<day>"
  id: ID!
  account: PerplAccount!
  accountId: BigInt!
  day: Int! @index
  date: String!
  trades: Int!
  openingTrades: Int!
  closingTrades: Int!
  wins: Int!
  losses: Int!
  realizedPnlCNS: BigInt!
  fundingCNS: BigInt!
  feesCNS: BigInt!
  netPnlCNS: BigInt!
  volumeCNS: BigInt!
  openingNotionalCNS: BigInt!
  leverageNotionalSum: BigInt!
  startCumPnlCNS: BigInt!
  endCumPnlCNS: BigInt!
  highCumPnlCNS: BigInt!
  lowCumPnlCNS: BigInt!
  "Largest drop from the intraday running high (starting at startCumPnl)."
  maxIntradayDrawdownCNS: BigInt!
  marketsTraded: [Int!]!
  lastTradeAt: Int!
}

"Daily point of the realized equity curve (end of day values)."
type EquityPoint {
  "<accountId>-<day>"
  id: ID!
  account: PerplAccount!
  accountId: BigInt!
  day: Int! @index
  date: String!
  timestamp: Int!
  cumulativeNetPnlCNS: BigInt!
  peakNetPnlCNS: BigInt!
  drawdownCNS: BigInt!
  netDepositedCNS: BigInt!
  "netDeposited + cumulative net PnL"
  equityCNS: BigInt!
  trades: Int!
}

# ------------------------------------------------------------------------------------------------
# Mirror
# ------------------------------------------------------------------------------------------------

"A follower's copy-trading account (EIP-1167 clone)."
type MirrorAccount {
  "clone address"
  id: ID!
  address: String!
  owner: String! @index
  salt: String!
  perplAccount: PerplAccount
  perplAccountId: BigInt
  teamRun: Boolean! @index
  createdAt: Int!
  createdBlock: Int!
  createdTx: String!
  paused: Boolean!
  maxLeverageHdths: Int!
  maxSlippageBps: Int!
  dailyLossBps: Int!
  drawdownBps: Int!
  expiry: BigInt!
  "Opening copies further than this from the leader's onchain entry are blocked (0 = off)."
  maxEntryDeviationBps: Int!
  "Slippage bound for closes sent by a triggered stop."
  stopSlippageBps: Int!
  "Anyone may flatten the account (or a leader's positions) once a loss stop is hit."
  flattenOnStop: Boolean!
  "Highest builder fee per 100,000 of opening notional the owner accepts; opening copies are blocked (BuilderFeeTooHigh) when the account's fixed fee is above it."
  maxBuilderFeePer100K: Int!
  leaderAccountIds: [BigInt!]!
  leaderRatiosBps: [Int!]!
  "Per leader, same order as leaderAccountIds: most margin the leader's positions may hold."
  leaderBudgetsCNS: [BigInt!]!
  "Per leader, same order as leaderAccountIds: loss stop in bps of the budget (0 = off)."
  leaderLossStopsBps: [Int!]!
  marketIds: [Int!]!
  marketMaxNotionalsCNS: [BigInt!]!
  policyVersion: Int!
  policyUpdatedAt: Int!
  netDepositsCNS: BigInt!
  totalDepositedCNS: BigInt!
  totalWithdrawnCNS: BigInt!
  funded: Boolean!
  copiesExecuted: Int!
  copiesBlocked: Int!
  matchNowCopies: Int!
  copiedNotionalCNS: BigInt!
  "Sum of CopyEvent.builderFeeCNS over this account's copies (keeper copies and match-now)."
  builderFeesCNS: BigInt!
  closeAllCount: Int!
  marketCloseCount: Int!
  stopsTriggered: Int!
  leaderStops: Int!
  "Leaders currently detached (MirrorAccount.leaderDetached): copies naming them are blocked (LeaderDetached), their positions are kept."
  detachedLeaderAccountIds: [BigInt!]!
  lastCopyAt: Int! @index
  lastActivityAt: Int!
  leaderRules: [MirrorLeaderRule!]! @derivedFrom(field: "mirrorAccount")
  marketRules: [MirrorMarketRule!]! @derivedFrom(field: "mirrorAccount")
  levels: [MirrorLevel!]! @derivedFrom(field: "mirrorAccount")
  stops: [StopTrigger!]! @derivedFrom(field: "mirrorAccount")
  detachEvents: [LeaderDetachEvent!]! @derivedFrom(field: "mirrorAccount")
  leaderPnl: [FollowerLeaderPnl!]! @derivedFrom(field: "mirrorAccount")
  copies: [CopyEvent!]! @derivedFrom(field: "mirrorAccount")
  blocked: [BlockedCopy!]! @derivedFrom(field: "mirrorAccount")
  activity: [MirrorActivity!]! @derivedFrom(field: "mirrorAccount")
}

type MirrorLeaderRule {
  "<mirrorAccount>-<leaderAccountId>"
  id: ID!
  mirrorAccount: MirrorAccount!
  leaderAccountId: BigInt! @index
  leader: PerplAccount!
  ratioBps: Int!
  "Most collateral this leader's positions may hold as margin."
  budgetCNS: BigInt!
  "Stop copying the leader once its PnL since it was added falls below -lossStopBps x budget (0 = off)."
  lossStopBps: Int!
  "The leader's loss stop fired; cleared by the next PolicyUpdated listing the leader (the contract re-arms it)."
  stopped: Boolean!
  stoppedAt: Int
  "Leader PnL (realized + unrealized, net of fees) when the stop fired; negative."
  stopPnlCNS: BigInt
  stopLimitCNS: BigInt
  stopCount: Int!
  """
  MirrorAccount.leaderDetached: "stop following, keep my positions". Copies naming the leader (opens and closes,
  keeper and match-now) are blocked with LeaderDetached while set. Kept by setPolicy for leaders that stay listed;
  cleared when the leader is removed from the policy and by follow() for every leader it lists.
  """
  detached: Boolean! @index
  "Last time detached was set to true (kept after it is cleared)."
  detachedAt: Int
  detachCount: Int!
  active: Boolean! @index
  updatedAt: Int!
}

"A per-leader detach change (LeaderDetachedSet)."
type LeaderDetachEvent {
  "<txHash>-<logIndex>"
  id: ID!
  mirrorAccount: MirrorAccount!
  leaderAccountId: BigInt! @index
  leader: PerplAccount!
  detached: Boolean!
  teamRun: Boolean!
  blockNumber: Int!
  timestamp: Int! @index
  txHash: String!
  logIndex: Int!
}

type MirrorMarketRule {
  "<mirrorAccount>-<perpId>"
  id: ID!
  mirrorAccount: MirrorAccount!
  perpId: Int!
  market: Market!
  maxNotionalCNS: BigInt!
  "Set when an owner stop-loss / take-profit level fired; opening copies are blocked until the next policy."
  halted: Boolean!
  haltedAt: Int
  active: Boolean!
  updatedAt: Int!
}

"Owner stop-loss / take-profit level on one market (LevelSet)."
type MirrorLevel {
  "<mirrorAccount>-<perpId>"
  id: ID!
  mirrorAccount: MirrorAccount!
  perpId: Int!
  market: Market!
  "Side of the position the level protects."
  side: Side!
  "0 = none"
  stopLossPNS: BigInt!
  "0 = none"
  takeProfitPNS: BigInt!
  slippageBps: Int!
  "False once cleared (both prices 0) or once it fired and closed the whole position."
  active: Boolean!
  setAt: Int!
  triggeredAt: Int
  triggeredKind: StopKind
  updatedAt: Int!
}

"A stop anyone may trigger (StopTriggered): account loss stop, leader loss stop or an owner level."
type StopTrigger {
  "<txHash>-<logIndex>"
  id: ID!
  mirrorAccount: MirrorAccount!
  caller: String!
  kind: StopKind! @index
  kindCode: Int!
  "perpId for StopLoss/TakeProfit, leader account id for LeaderLoss, 0 for DailyLoss/Drawdown"
  scope: Int!
  perpId: Int
  market: Market
  leaderAccountId: BigInt
  leader: PerplAccount
  "Equity floor (account stops), loss limit (leader stop) or the level price (levels)."
  limit: BigInt!
  "Equity (account stops), loss (leader stop) or Perpl's mark (levels)."
  actual: BigInt!
  "Fresh Chainlink price for levels (0 if stale or unused)."
  oraclePNS: BigInt!
  "Positions closed (account and leader stops); null for levels."
  positionsClosed: Int
  "Lots closed (levels); null for account and leader stops."
  lotsClosedLNS: BigInt
  teamRun: Boolean!
  blockNumber: Int!
  timestamp: Int! @index
  txHash: String!
  logIndex: Int!
}

"An executed copy (Mirrored event)."
type CopyEvent {
  "<txHash>-<logIndex>"
  id: ID!
  mirrorAccount: MirrorAccount!
  follower: PerplAccount
  keeper: String!
  leaderAccountId: BigInt! @index
  leader: PerplAccount!
  perpId: Int!
  market: Market!
  orderType: MirrorOrderType!
  isOpen: Boolean!
  lotLNS: BigInt!
  "Limit price of the IOC order"
  pricePNS: BigInt!
  "Execution price from the follower's Perpl position event in the same tx (falls back to pricePNS)"
  fillPricePNS: BigInt!
  leverageHdths: Int!
  lotsBeforeLNS: BigInt!
  lotsAfterLNS: BigInt!
  filledLotsLNS: BigInt!
  notionalCNS: BigInt!
  leaderRef: String! @index
  "True for owner match-now orders (leaderRef == keccak256('MIRROR_MATCH_NOW'))"
  isMatchNow: Boolean!
  teamRun: Boolean!

  # ---- copy-quality proof (docs/indexer.md, "Copy quality")
  "CopyProof.leaderFillPNS: the leader fill price reported by the keeper (0 = not reported). Informational; no rule trusts it."
  leaderFillReportedPNS: BigInt!
  "The leader's actual fill: lots-weighted price of the leader's priced Perpl position events in this market in the leaderRef tx. Null if that tx was not indexed or had none."
  leaderFillActualPNS: BigInt
  "First leader Perpl position event in this market in the leaderRef tx."
  leaderEvent: PositionEvent
  leaderBlock: Int
  leaderTimestamp: Int
  "Reported and actual leader fill both known and more than 1 PNS apart (derived prices can be off by 1 PNS)."
  leaderFillMismatch: Boolean! @index
  "(reported - actual) / actual in bps, when both are known."
  leaderFillDiffBps: Int
  "CopyProof.leaderEntryPNS: the leader's onchain average entry on the copied side at copy time (0 for closes)."
  leaderEntryPNS: BigInt!
  "CopyProof.markPNS: Perpl mark at copy time."
  markPNS: BigInt!
  "CopyProof.fillPNS: the follower's average fill of the added lots (opens; 0 for closes or no fill)."
  proofFillPNS: BigInt!
  "CopyProof.entryDeviationBps: proofFillPNS vs leaderEntryPNS, positive = follower worse (opens only)."
  entryDeviationBps: Int!
  "CopyProof.builderFeeCNS: builder fee the MirrorAccount computed for this copy (added lots x fill x rate, rounded up; 0 for closes)."
  builderFeeCNS: BigInt!
  "Exact builder fee from Perpl's TakerOrderFilledV2 for Mirror's builder id in this tx (the fills right before this Mirrored log). Null when no such fill was indexed (closes, or pre-builder copies)."
  builderFeePerplCNS: BigInt
  "Follower fill price used for quality stats: the proof for opens, the follower's own Perpl event in this tx for closes."
  followerFillPNS: BigInt
  followerFillSource: FollowerFillSource!
  followerEvent: PositionEvent
  "ACTUAL when leaderFillActualPNS is known, else REPORTED when the keeper reported one, else NONE. NONE for match-now."
  leaderFillBasis: LeaderFillBasis!
  "followerFill vs the leader fill (basis above) in bps, positive = follower worse (paid more on a buy, received less on a sell)."
  deviationBps: Int
  "copy block - leader event block (Monad blocks are ~0.4 s, block timestamps are whole seconds)."
  latencyBlocks: Int
  latencySeconds: Int
  "Follower or leader is team-run: kept out of the public copy-quality aggregates (counted in the teamRun scope)."
  excludedFromStats: Boolean! @index

  blockNumber: Int!
  timestamp: Int! @index
  txHash: String! @index
  logIndex: Int!
}

"A copy the follower's onchain policy refused (Blocked event)."
type BlockedCopy {
  "<txHash>-<logIndex>"
  id: ID!
  mirrorAccount: MirrorAccount!
  keeper: String!
  leaderAccountId: BigInt! @index
  leader: PerplAccount!
  perpId: Int!
  market: Market!
  reason: BlockReason! @index
  reasonCode: Int!
  orderType: MirrorOrderType!
  lotLNS: BigInt!
  limit: BigInt!
  actual: BigInt!
  leaderRef: String!
  "Leader fill price reported by the keeper (0 = unknown)."
  leaderFillPNS: BigInt!
  "Perpl mark at the time of the attempt."
  markPNS: BigInt!
  isMatchNow: Boolean!
  teamRun: Boolean!
  "Follower or leader is team-run (see CopyEvent.excludedFromStats)."
  excludedFromStats: Boolean!
  blockNumber: Int!
  timestamp: Int! @index
  txHash: String!
  logIndex: Int!
}

"""
A Perpl TakerOrderFilledV2 attributed to Mirror's builder id (ENVIO_MIRROR_BUILDER_ID, default 26). The event
carries no account or perp, so it is linked to the copy by transaction: the first Mirrored log after it in the
same tx (Perpl fills inside execOrderV2 before the MirrorAccount emits Mirrored).
"""
type BuilderFeeFill {
  "<txHash>-<logIndex>"
  id: ID!
  builderId: BigInt!
  builderFeeCNS: BigInt!
  "Perpl taker fee on the fill."
  feeCNS: BigInt!
  lotLNS: BigInt!
  entryPricePNS: BigInt!
  "The copy this fill was attributed to (null until a Mirrored log in the same tx claims it)."
  copy: CopyEvent
  blockNumber: Int!
  timestamp: Int! @index
  txHash: String! @index
  logIndex: Int!
}

"Realized PnL of one follower attributed to one leader (FIFO lots per follower+perp)."
type FollowerLeaderPnl {
  "<mirrorAccount>-<leaderAccountId> (leader 0 = owner/manual trades)"
  id: ID!
  mirrorAccount: MirrorAccount!
  followerAccountId: BigInt!
  leaderAccountId: BigInt! @index
  leader: PerplAccount
  realizedPnlCNS: BigInt!
  fundingCNS: BigInt!
  feesCNS: BigInt!
  netPnlCNS: BigInt!
  closedLotsFills: Int!
  wins: Int!
  losses: Int!
  copiedOpens: Int!
  copiedCloses: Int!
  copiedNotionalCNS: BigInt!
  teamRun: Boolean!
  updatedAt: Int!
}

"FIFO lot queue of a follower's position in one market. Invariant: sum(lots) == position lots."
type FollowerLotQueue @internal {
  "<perplAccountId>-<perpId>"
  id: ID!
  mirrorAccountId: String!
  "Leader account id per tranche; '0' = not (yet) attributed to a copy"
  leaderIds: [String!]!
  lots: [BigInt!]!
  "Opening fees not yet attributed to a leader (assigned by the next Mirrored open)"
  pendingFeeCNS: BigInt!
}

"Unified per-account feed (Mirrored/Blocked/Deposited/Withdrawn/PolicyUpdated/Paused/ClosedAll...)."
type MirrorActivity {
  "<txHash>-<logIndex>"
  id: ID!
  mirrorAccount: MirrorAccount!
  kind: ActivityKind! @index
  amountCNS: BigInt
  copy: CopyEvent
  blocked: BlockedCopy
  stop: StopTrigger
  detail: String
  teamRun: Boolean!
  blockNumber: Int! @index
  timestamp: Int! @index
  txHash: String!
  logIndex: Int!
}

