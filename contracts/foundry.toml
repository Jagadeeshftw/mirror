[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
via_ir = true
bytecode_hash = "none"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 128

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 110

[lint]
lint_on_build = false
